name: ES-PET Mini firmware build
on:
  push:
    branches: [feature/ultimate-xiao-c6]
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'platformio.ini'
      - 'src/CMakeLists.txt'
      - '.github/workflows/ultimate-mini-build.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [trimagotchi-c6, ultimate-xiao-c6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile firmware
        run: pio run -e ${{ matrix.target }}
