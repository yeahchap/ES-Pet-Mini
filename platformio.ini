[platformio]
default_envs = trimagotchi-c6

[env:trimagotchi-c6]
platform = espressif32 @ 7.0.1
board = esp32-c6-devkitc-1
framework = espidf

board_upload.flash_size = 4MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv

monitor_speed = 115200
monitor_filters =
  esp32_exception_decoder
  time

build_type = debug

# Release builds contain no detailed XP-source tracing. The daily radio-XP
# counter is operational cap state, not retained diagnostic history.
build_flags =
  -DES_PET_ECONOMY_TRACE=0

# One-off Ultimate ES-PET Mini prototype. RC7 build above remains unchanged.
[env:ultimate-xiao-c6]
extends = env:trimagotchi-c6
build_flags =
  -DES_PET_ECONOMY_TRACE=0
  -DES_PET_ULTIMATE_XIAO=1
